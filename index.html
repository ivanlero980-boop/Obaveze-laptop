<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007a3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Obaveze"><link rel="manifest" href="manifest.json?v=20261127-82"><link rel="apple-touch-icon" href="icon-192.png?v=20261127-82"><title>Obaveze</title>
<style>
:root{
  --bg:#f5f7f6;
  --paper:#ffffff;
  --paper-soft:#fafbfa;
  --ink:#17201b;
  --text:#253029;
  --mute:#7b8680;
  --line:#e0e6e2;
  --green:#007a3d;
  --green-deep:#006b35;
  --green-soft:#eaf5ef;
  --amber:#e09a18;
  --amber-soft:#fff5df;
  --red:#d94f55;
  --red-soft:#fff0f1;
  --shadow:0 7px 22px rgba(27,54,40,.08);
  --shadow-soft:0 3px 12px rgba(27,54,40,.06);
  --radius:18px;
  --muted:var(--mute);
  --card:var(--paper);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:auto;padding:0 16px 110px}
h1,h2,h3,p{margin:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)}
.sm{font-size:13px}
.xs{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:800}
.num{font-weight:800;font-variant-numeric:tabular-nums}
.hot{color:var(--red)}
.amber{color:var(--amber)}
.green{color:var(--green)}

/* ===== Exact approved dashboard direction ===== */
.dashboardHero{
  margin:0 -16px 14px;
  padding:13px 18px 14px;
  min-height:0;
  background:linear-gradient(145deg,#008348 0%,#006f39 56%,#006130 100%);
  color:#fff;
  border-radius:0 0 18px 18px;
  box-shadow:0 6px 20px rgba(0,92,47,.14);
}
.heroTop{display:flex;align-items:center;justify-content:space-between;gap:14px}
.logoPlate{
  width:146px;height:47px;
  background:#fff;
  border-radius:9px;
  padding:5px 8px;
  display:flex;align-items:center;
  box-shadow:0 2px 9px rgba(0,0,0,.08);
}
.logoPlate img{display:block;width:100%;height:100%;object-fit:contain}
.menuCircle{
  width:40px;height:40px;border-radius:11px;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.10);
  color:#fff;display:grid;place-items:center;
  font-size:22px;line-height:1;
}
.heroBody{
  display:grid;
  grid-template-columns:minmax(0,1fr) 88px;
  gap:12px;
  align-items:center;
  margin-top:12px;
}
.greeting{font-size:21px;line-height:1.08;font-weight:500;letter-spacing:-.02em}
.greeting b{font-weight:800}
.heroSub{margin-top:5px;font-size:13px;color:rgba(255,255,255,.84)}
.priorityCard{
  min-height:72px;
  border-radius:12px;
  padding:9px 7px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.10);
  text-align:center;
  display:flex;flex-direction:column;justify-content:center;
}
.priorityLabel{font-size:10px;color:rgba(255,255,255,.9)}
.priorityLabel .star{color:#ffc43d;margin-right:4px}
.priorityNumber{font-size:25px;font-weight:800;line-height:1;margin:4px 0 2px}
.priorityFoot{font-size:10px;color:rgba(255,255,255,.82)}

.dashboardKpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
  margin-bottom:13px;
}
.summaryTile{
  min-width:0;
  min-height:88px;
  background:#fff;
  border:1px solid #edf0ee;
  border-radius:13px;
  box-shadow:var(--shadow-soft);
  padding:8px 5px 7px;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;
}
.summaryIcon{width:22px;height:22px;color:var(--green);margin-bottom:4px}
.summaryIcon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.summaryTitle{font-size:10px;line-height:1.1;color:#1f2823;min-height:22px;display:flex;align-items:center;justify-content:center}
.summaryValue{font-size:23px;line-height:1;font-weight:800;color:var(--green-deep);margin:4px 0 3px}
.summaryFoot{font-size:9px;color:var(--green-deep);line-height:1.1}
.summaryTile.due .summaryFoot{color:var(--amber)}
.summaryTile.zero{opacity:.53}
.summaryTile.zero .summaryValue{color:#8f9993}

.sectionHead{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin:13px 2px 7px;
}
.sectionHead h2{font-size:16px;letter-spacing:-.01em}
.sectionLink{
  color:var(--green-deep);font-size:13px;font-weight:700;
  border:0;background:none;padding:4px 0;
}
.sectionCard{
  background:#fff;
  border:1px solid #edf0ee;
  border-radius:13px;
  box-shadow:var(--shadow-soft);
  overflow:hidden;
}
.todayRow,.upcomingRow{
  position:relative;
  display:grid;
  align-items:center;
  min-width:0;
}
.todayRow{
  grid-template-columns:34px minmax(0,1fr) auto 24px;
  gap:10px;
  padding:12px 14px 12px 16px;
  min-height:68px;
}
.todayRow+.todayRow,.upcomingRow+.upcomingRow{border-top:1px solid var(--line)}
.todayRow:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#c4ccc7;
}
.todayRow.soon:before{background:var(--amber)}
.todayRow.late:before{background:var(--red)}
.checkBox,.pendingCircle{
  width:24px;height:24px;border:1.7px solid #9aa49e;border-radius:50%;
  background:#fff;padding:0;
}
.pendingCircle{justify-self:end}
.checkBox:active,.pendingCircle:active{background:#eef2ef}
.rowTitle{font-size:14px;font-weight:750;line-height:1.22;overflow-wrap:anywhere}
.rowMeta{font-size:11px;color:var(--mute);margin-top:4px;line-height:1.25}
.rowDue{font-size:11px;font-weight:700;color:var(--red);white-space:nowrap}
.upcomingRow{
  grid-template-columns:54px minmax(0,1fr) 27px;
  gap:11px;padding:11px 14px;min-height:66px;
}
.dateBox{border-right:1px solid var(--line);padding-right:10px;text-align:center}
.dateDay{font-size:21px;line-height:1;font-weight:800;color:var(--green-deep)}
.dateMonth{font-size:10px;text-transform:uppercase;color:var(--mute);margin-top:4px;font-weight:700}
.typeIcon{width:24px;height:24px;color:var(--green);display:grid;place-items:center}
.typeIcon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dashboardEmpty{padding:17px;text-align:center;color:var(--mute);font-size:13px}

/* Other screens, same visual language */
.top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin:0 -16px 14px;padding:19px 18px 17px;
  background:linear-gradient(145deg,#008348 0%,#006f39 68%,#006130 100%);
  color:#fff;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(0,92,47,.12);
}
.top h1{font-size:25px;letter-spacing:-.025em}
.top .sm{margin-top:3px;color:rgba(255,255,255,.78)}
.top .btn{width:42px;height:42px;padding:0;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22)}
.card{
  background:#fff;border:1px solid #edf0ee;border-radius:16px;
  padding:15px;margin-bottom:10px;box-shadow:var(--shadow-soft);min-width:0;
}
.tight{padding:13px}
.list{display:flex;flex-direction:column;gap:9px}
.list>.card{margin-bottom:0}
.taskTitle{font-size:15px;font-weight:750;line-height:1.28;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{
  display:inline-flex;align-items:center;
  min-height:26px;padding:4px 9px;border-radius:999px;
  background:#f3f5f4;border:1px solid #e2e7e4;
  color:#68736d;font-size:11px;line-height:1.1;
}
.chip.person{background:var(--green-soft);border-color:#d1e9dc;color:var(--green-deep)}
.chip.priority.strategic{background:var(--amber-soft);border-color:#f1d69c;color:#976310}
.chip.date{background:#f6f7f6;color:#6b756f}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;
}
.btn.pri,.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:750}
.btn.danger,.danger{color:var(--red)}
.btnrow{display:flex;gap:8px}.btnrow .grow{flex:1}
.tabs{display:flex;gap:6px;overflow:auto;margin:0 -2px 12px;padding:2px 2px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .btn{white-space:nowrap;border-radius:999px;padding:8px 12px;font-size:13px;color:#68736d;background:#fff}
.tabs .btn.on{background:var(--green-soft);border-color:#cfe5d8;color:var(--green-deep);font-weight:750}
.secondaryCard{position:relative;padding:14px 14px 13px 16px;overflow:hidden}
.secondaryCard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#c4ccc7}
.secondaryCard.late:before{background:var(--red)}
.secondaryCard.soon:before{background:var(--amber)}
.secondaryCard.strategic:before{background:#c4ccc7}
.secondaryTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.secondaryDue{font-size:11px;font-weight:750;white-space:nowrap;color:var(--mute);padding-top:1px}
.secondaryDue.late{color:var(--red)}
.secondaryDue.soon{color:var(--amber)}
.secondaryMeta{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.3}
.actionOrigin{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--green-soft);border:1px solid #d1e9dc;font-size:12px;line-height:1.35;color:var(--green-deep)}
.actionContext{margin:12px 0 4px;padding:12px;border:1px solid #d1e9dc;border-radius:13px;background:var(--green-soft)}
.actionContextTitle{font-size:12px;font-weight:800;color:var(--green-deep);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.actionContextRow{font-size:13px;line-height:1.45;margin-top:6px}.actionContextRow:first-of-type{margin-top:0}.actionContextRow b{color:var(--green-deep)}
.projectCard,.noteCard{padding:14px}
.projectLead,.noteLead{display:flex;align-items:flex-start;gap:12px}
.secondaryIcon{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:var(--green-soft);color:var(--green-deep);display:grid;place-items:center}
.secondaryIcon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.countBadge{display:inline-flex;align-items:center;justify-content:center;min-width:62px;min-height:27px;padding:4px 8px;border-radius:999px;background:#f2f5f3;color:var(--green-deep);font-size:11px;font-weight:750;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.kpi{background:#fff;border:1px solid #edf0ee;border-radius:15px;padding:12px;box-shadow:var(--shadow-soft)}
.kpi .num{font-size:27px;margin-top:3px}
.kpi.zero{opacity:.55}
.f{display:block;margin-bottom:11px}.f span{display:block;margin-bottom:5px}
input,select,textarea{
  width:100%;background:#fff;border:1px solid #dce3df;border-radius:11px;padding:11px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,122,61,.10)}
textarea{min-height:96px;resize:vertical}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* Dialogs */
dialog{border:0;background:transparent;padding:0;width:min(680px,calc(100% - 20px));color:var(--ink)}
dialog::backdrop{background:rgba(12,24,17,.38);backdrop-filter:blur(2px)}
.sheet{
  background:var(--bg);border:1px solid var(--line);border-radius:21px;
  padding:16px;max-height:88vh;overflow:auto;box-shadow:0 18px 55px rgba(14,34,22,.19);
}

/* FAB */
.fab{
  position:fixed;right:max(20px,calc((100vw - 720px)/2 + 20px));bottom:82px;
  width:60px;height:60px;border-radius:50%;border:5px solid var(--bg);
  background:linear-gradient(145deg,#00864a,#006f39);color:#fff;font-size:31px;
  box-shadow:0 9px 28px rgba(0,111,57,.28);z-index:20;
}

/* Bottom navigation */
nav{
  position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);backdrop-filter:blur(16px);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:19;
}
nav .inner{width:min(720px,100%);display:grid;grid-template-columns:repeat(6,1fr)}
nav button{
  min-height:72px;background:none;border:0;color:#7f8983;padding:9px 2px 7px;
  font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  position:relative;
}
.navIcon{width:25px;height:25px}
.navIcon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--green-deep)}
nav button.on:after{
  content:"";position:absolute;bottom:4px;left:29%;right:29%;height:3px;border-radius:3px;background:var(--green);
}

/* Browser / install landing */
.browserLanding{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px 60px}
.browserLandingCard{width:min(520px,100%);background:#fff;border:1px solid #edf0ee;border-radius:22px;box-shadow:var(--shadow);padding:24px 20px;text-align:center}
.browserLandingLogo{width:170px;height:58px;margin:0 auto 20px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center}
.browserLandingLogo img{display:block;width:100%;height:100%;object-fit:contain}
.browserLanding h1{font-size:28px;letter-spacing:-.02em;margin-bottom:8px}
.browserLanding p{font-size:15px;line-height:1.5;color:var(--mute);margin:0 auto;max-width:420px}
.browserLanding .localBadge{display:inline-flex;align-items:center;gap:7px;margin:18px 0 16px;padding:8px 12px;border-radius:999px;background:var(--green-soft);color:var(--green-deep);font-size:13px;font-weight:750}
.browserLanding .steps{margin-top:18px;text-align:left;background:var(--paper-soft);border:1px solid var(--line);border-radius:15px;padding:14px 16px;color:var(--text);font-size:14px;line-height:1.5}
.browserLanding .steps b{display:block;margin-bottom:5px}

/* Safety */
.card,.row,.grow,.taskTitle,label,summary{min-width:0}
.card b,.card .sm,.card .xs,.taskTitle,label,summary{overflow-wrap:anywhere}
@media(max-width:380px){
  .dashboardHero{padding-left:16px;padding-right:16px}
  .logoPlate{width:138px;height:46px}
  .heroBody{grid-template-columns:minmax(0,1fr) 86px}
  .dashboardKpis{gap:6px}
  .summaryTile{padding-left:4px;padding-right:4px}
  .summaryTitle{font-size:11px}
}

.filterScroll{display:flex;gap:7px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}.filterScroll::-webkit-scrollbar{display:none}.filterScroll .btn{flex:0 0 auto}

.filterLabel{margin:12px 0 5px}
.actionSearch{display:flex;align-items:center;gap:8px;margin:10px 0 4px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.actionSearch span{font-size:20px;color:var(--muted)}
.actionSearch input{width:100%;border:0;outline:0;background:transparent;padding:12px 0;font:inherit;color:inherit}
.actionGroup{margin-top:15px}
.actionGroupHead{width:100%;border:0;background:transparent;padding:4px 2px 8px;display:flex;justify-content:space-between;align-items:center;font:inherit;font-weight:750;color:inherit;text-align:left}
.actionGroupCount{font-size:13px;color:var(--muted);font-weight:650}
.actionGroupList{margin-top:0}
.projectLate{border-left:4px solid var(--red)}

.projectActionsTitle{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);align-items:center}
.projectActionsWrap{margin-top:8px}
.projectActionGroup{margin-top:13px}
.projectActionHead{display:flex;justify-content:space-between;align-items:center;padding:0 2px 6px;font-size:13px;font-weight:750;color:var(--muted)}
.noteInput{min-height:180px}.noteFull{white-space:pre-wrap;font-size:16px;line-height:1.5;margin-top:14px}

.menuSectionLabel{margin:16px 2px 7px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.menuItem{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;color:inherit}
.backupNotice{border-left:4px solid var(--amber)}
.personActionGroup,.archiveSection{margin-top:14px}

.meetingCard{cursor:pointer}
.meetingKpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.meetingKpis .kpi{padding:10px 6px}
.meetingKpis .num{font-size:23px}
.meetingAddGrid{display:grid;grid-template-columns: repeat(2,1fr);gap:8px;margin-top:12px}
.meetingAddGrid .btn{padding-left:6px;padding-right:6px}
.meetingGroup{margin-top:12px}
@media(max-width:380px){.meetingKpis{grid-template-columns:repeat(2,1fr)}}


.seriesLink{border:0;background:none;padding:6px 0;color:var(--green-deep);font-weight:750;font-size:13px}
.seriesCard{cursor:pointer}


.meetingTitle{margin-top:5px;font-size:14px;font-weight:750;color:var(--text)}


.starMark{font-weight:700}

.minutesPreview{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:12px}
.minutesPreview .minutesTitle{font-size:22px;font-weight:800;text-align:center;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 4px 12px}
.minutesMetaGrid{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:start;margin:14px 0 18px}
.minutesMetaLabel{font-size:12px;color:var(--mute);font-weight:750;padding-top:9px}
.minutesPreview input,.minutesPreview textarea{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.minutesSection{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.minutesSection h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--green-deep);margin:0 0 7px}
.minutesSection textarea{min-height:92px;line-height:1.45;resize:vertical}
.minutesHint{font-size:12px;color:var(--mute);line-height:1.4;margin-top:8px}
.minutesActions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
@media(max-width:380px){.minutesMetaGrid{grid-template-columns:1fr;gap:4px}.minutesMetaLabel{padding-top:0}.minutesActions{grid-template-columns:1fr}}


.agendaMeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.agendaConclusion{margin-top:7px;font-size:13px;line-height:1.4;color:var(--text)}
.agendaUnprocessed{border-left:4px solid var(--amber)}
.agendaTransferred{border-left:4px solid var(--green)}
.seriesReview{margin:14px 0 4px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--paper-soft)}
.seriesReviewGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}
.seriesReviewStat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center}
.seriesReviewStat b{display:block;font-size:20px}
.seriesReviewList{margin-top:10px}
.seriesReviewItem{padding:9px 10px;border-top:1px solid var(--line);cursor:pointer}
.seriesReviewItem:first-child{border-top:0}
.finishTopic{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.finishTopic:first-child{border-top:0}.finishTopic input{width:auto;margin-top:4px}
.minutesPreview{max-width:680px;margin:12px auto 0}
.minutesHeader{text-align:center;padding-bottom:14px;border-bottom:2px solid var(--green)}
.minutesHeader h2{font-size:23px;margin:0 0 4px}
.minutesHeader .minutesSub{font-size:14px;color:var(--mute);font-weight:650}
.minutesFacts{display:grid;grid-template-columns:105px 1fr;gap:7px 12px;margin-top:14px;text-align:left}
.minutesFactLabel{font-size:12px;color:var(--mute);font-weight:750}
.minutesLocked{background:var(--paper-soft);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.minutesRecord{border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:8px;background:#fff}
.minutesRecordHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.minutesRecordTitle{font-weight:800;line-height:1.35}
.minutesRecordMeta{font-size:12px;color:var(--mute);margin-top:5px;line-height:1.45}
.minutesRecordText{font-size:13px;line-height:1.5;margin-top:7px;white-space:pre-wrap}
.minutesEdit{border:0;background:none;color:var(--green-deep);font-weight:750;padding:2px 0;white-space:nowrap}
.minutesFreeText{min-height:95px;line-height:1.5;resize:vertical}

<script>
const APP_VERSION="v96 · 27.11.2026.";
const KEY="obaveze_laptop_v1";
try{if(!localStorage.getItem(KEY)&&localStorage.getItem("obaveze_app_v1"))localStorage.setItem(KEY,localStorage.getItem("obaveze_app_v1"))}catch(e){}
const IMPORTED=[];
const $=q=>document.querySelector(q), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const iso=d=>{const x=new Date(d),y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,"0"),da=String(x.getDate()).padStart(2,"0");return `${y}-${m}-${da}`}, today=()=>iso(new Date());
function fmtDate(d){
 if(!d)return "";
 const [y,m,da]=String(d).split("-");
 return y&&m&&da?`${da}.${m}.${y}.`:d;
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S){S={items:IMPORTED,people:[],meetings:[],meetingSeries:[],lastId:0,lastMeetingId:0,lastSeriesId:0};}
function norm(){
 S.items=S.items||[];
 if("weeklyReviews" in S)delete S.weeklyReviews;
 S.lastZakljucakId=Number(S.lastZakljucakId)||0;
 if(!S.liveDrafts||typeof S.liveDrafts!=="object"||Array.isArray(S.liveDrafts))S.liveDrafts={};
 try{const old=localStorage.getItem("obaveze_laptop_drafts");if(old){const o=JSON.parse(old)||{};Object.keys(o).forEach(k=>{if(!S.liveDrafts[k])S.liveDrafts[k]=o[k]});localStorage.removeItem("obaveze_laptop_drafts")}}catch(e){}
 S.items.forEach(x=>{
  x.ID=Number(x.ID)||++S.lastId; S.lastId=Math.max(S.lastId,x.ID);
  if(x.Tip==="Akcija"){
   x.Status=x.Status==="Završeno"?"Završeno":"Otvoreno";delete x.CekaDrugog;
   if(x.Prioritet==="Strateško"){x.Znacaj="Strateško";x.Prioritet="Normalan";}
   else if(x.Prioritet==="Operativno"||x.Prioritet==="Sitno"||!x.Prioritet)x.Prioritet="Normalan";
   if(!x.Znacaj)x.Znacaj="Operativno";
  }
  if(x.Tip==="Beleška"){
   if(x.Prioritet==="Strateško"){x.Znacaj="Strateško";x.Prioritet="Normalan";}
   else if(!["Visok","Normalan","Nizak"].includes(x.Prioritet))x.Prioritet="Normalan";
   if(!x.Znacaj)x.Znacaj="Operativno";
   if(x.Tekst===undefined)x.Tekst="";
  }
  if(x.Tip==="Akcija"||x.Tip==="Projekat"){
   if(!Array.isArray(x.RokIstorija))x.RokIstorija=[];
   if(x.Tip==="Akcija"&&!Array.isArray(x.OdgovorniIstorija))x.OdgovorniIstorija=[];
  }
  if(x.Tip==="Beleška"&&x.KolegijumID&&typeof x.AgendaStavka!=="boolean")x.AgendaStavka=true;
  if(x.Tip==="Beleška"&&x.ZaSledeciSastanak===true)x.AgendaStavka=true;
  if(x.Tip==="Beleška"&&x.AgendaStavka===true){
   if(typeof x.Zakljucak!=="string")x.Zakljucak="";
   if(!Array.isArray(x.Zakljucci))x.Zakljucci=x.Zakljucak.trim()?[{ID:++S.lastZakljucakId,Tekst:x.Zakljucak.trim()}]:[];
   x.Zakljucci=x.Zakljucci.filter(c=>c&&String(c.Tekst||"").trim()).map(c=>({ID:Number(c.ID)||++S.lastZakljucakId,Tekst:String(c.Tekst).trim()}));
   x.Zakljucci.forEach(c=>{S.lastZakljucakId=Math.max(S.lastZakljucakId,c.ID)});
   x.Zakljucak=x.Zakljucci.map(c=>c.Tekst).join("\n");
   if(typeof x.IzDiskusije!=="string")x.IzDiskusije="";
   if(typeof x.Obradjeno!=="boolean")x.Obradjeno=x.PrenosOdluka==="Ne prenosi";
   if(typeof x.PrenesiDalje!=="boolean")x.PrenesiDalje=false;
   if(x.PovezaniProjekatID)x.PovezaniProjekatID=Number(x.PovezaniProjekatID)||null;
  }
  if(x.Tip==="Beleška"&&typeof x.ZaSledeciSastanak!=="boolean")x.ZaSledeciSastanak=false;
  if(x.SerijaID)x.SerijaID=Number(x.SerijaID)||null;
  if(x.ProjekatID)x.ProjekatID=Number(x.ProjekatID)||null;
  if(x.ZakljucakID)x.ZakljucakID=Number(x.ZakljucakID)||null;
  if(x.AgendaIzvorID)x.AgendaIzvorID=Number(x.AgendaIzvorID)||null;
  if(x.PrenesenoIzSastankaID)x.PrenesenoIzSastankaID=Number(x.PrenesenoIzSastankaID)||null;
  if(x.PrenesenoNaSastanakID)x.PrenesenoNaSastanakID=Number(x.PrenesenoNaSastanakID)||null;
 });
 S.items.filter(x=>x.Tip==="Projekat").forEach(x=>{if(!x.Status)x.Status="Aktivan"});
 if(!Array.isArray(S.meetings))S.meetings=[];
 if(!Array.isArray(S.meetingSeries))S.meetingSeries=[];
 S.lastMeetingId=Number(S.lastMeetingId)||0;
 S.lastSeriesId=Number(S.lastSeriesId)||0;
 S.meetings.forEach(m=>{
  if(m&&"Naziv" in m&&!m.Naslov)m.Naslov=m.Naziv||"";
  if(m&&"Naziv" in m)delete m.Naziv;
  m.ID=Number(m.ID)||++S.lastMeetingId;
  S.lastMeetingId=Math.max(S.lastMeetingId,m.ID);
  if(m&&m.SerijaID)m.SerijaID=Number(m.SerijaID)||null;
  if(!Array.isArray(m.Ucesnici))m.Ucesnici=typeof m.Ucesnici==="string"?m.Ucesnici.split(/[,\n]/).map(x=>x.trim()).filter(Boolean):[];
  m.Status=m.Status==="Završen"?"Završen":"Aktivan";
 });
 S.meetingSeries.forEach(s=>{
  s.ID=Number(s.ID)||++S.lastSeriesId;
  S.lastSeriesId=Math.max(S.lastSeriesId,s.ID);
  if(!Array.isArray(s.Ucesnici))s.Ucesnici=typeof s.Ucesnici==="string"?s.Ucesnici.split(/[,\n]/).map(x=>x.trim()).filter(Boolean):[];
  s.Tip=s.Tip==="Projektna"?"Projektna":"Redovna";
  s.Status=s.Status==="Završen"?"Završen":"Aktivan";
  if(typeof s.Cilj!=="string")s.Cilj="";
  if(typeof s.Rok!=="string")s.Rok="";
  if(s.AgendaIzvorID)s.AgendaIzvorID=Number(s.AgendaIzvorID)||null;
  if(s.KolegijumID)s.KolegijumID=Number(s.KolegijumID)||null;
  if(s.IzvorSerijaID)s.IzvorSerijaID=Number(s.IzvorSerijaID)||null;
  if(s.NadProjekatID)s.NadProjekatID=Number(s.NadProjekatID)||null;
  if(s.NadProjekatID===s.ID)s.NadProjekatID=null;
  if(typeof s.Odgovoran!=="string")s.Odgovoran="";
 });
 // v70: serija = samo sastanci koji se ponavljaju; projekat je zaseban zapis.
 const isProj=id=>{const z=S.meetingSeries.find(q=>Number(q.ID)===Number(id));return !!(z&&z.Tip==="Projektna")};
 S.meetings.forEach(m=>{
  if(m.SerijaID&&isProj(m.SerijaID)){const pr=seriesById(m.SerijaID);m.ProjekatID=Number(m.SerijaID);if(!m.Naslov)m.Naslov=pr?.Naziv||"Sastanak";m.SerijaID=null;}
  if(m.ProjekatID)m.ProjekatID=Number(m.ProjekatID)||null;
 });
 S.items.forEach(x=>{
  if(x.SerijaID&&isProj(x.SerijaID)){
   if(!x.ProjekatID)x.ProjekatID=Number(x.SerijaID);
   const mm=x.KolegijumID?S.meetings.find(q=>Number(q.ID)===Number(x.KolegijumID)):null;
   x.SerijaID=mm&&mm.SerijaID&&!isProj(mm.SerijaID)?Number(mm.SerijaID):null;
   if(x.Tip==="Beleška"&&x.ZaSledeciSastanak&&!x.KolegijumID&&!x.SerijaID)x.ZaSledeciSastanak=false;
  }
 });
 // Add direct series links to existing meeting items. Existing information is preserved.
 S.items.forEach(x=>{
  if(x.KolegijumID&&!x.SerijaID){
   const m=S.meetings.find(mm=>Number(mm.ID)===Number(x.KolegijumID));
   if(m?.SerijaID)x.SerijaID=Number(m.SerijaID);
  }
 });
 // Existing carried agenda items from earlier versions get an explicit historical link.
 S.items.filter(x=>x.Tip==="Beleška"&&x.AgendaStavka===true&&x.PrenesenoIzSastankaID&&x.KolegijumID).forEach(copy=>{
  const source=S.items.find(n=>n.Tip==="Beleška"&&n.AgendaStavka===true&&Number(n.KolegijumID)===Number(copy.PrenesenoIzSastankaID)&&n.Zadatak===copy.Zadatak);
  if(source&&!source.PrenesenoNaSastanakID)source.PrenesenoNaSastanakID=Number(copy.KolegijumID);
 });
 S.people=[...new Set(S.items.map(x=>x.Odgovoran).filter(Boolean))].sort();
 Object.keys(S.liveDrafts).forEach(k=>{if(!S.items.some(x=>String(x.ID)===String(k)&&x.Tip==="Beleška"&&x.AgendaStavka===true))delete S.liveDrafts[k]});
 save(false);
}
let _syncBaseline=JSON.parse(JSON.stringify(S));
function syncComparable(x){
 if(!x)return "";
 const c={...x};delete c.Izmijenjeno;
 return JSON.stringify(c);
}
function stampChangedCollection(current,previous,now){
 const prevById=new Map((previous||[]).map(x=>[Number(x.ID),x]));
 (current||[]).forEach(x=>{
  const prev=prevById.get(Number(x.ID));
  if(!prev||syncComparable(x)!==syncComparable(prev))x.Izmijenjeno=now;
 });
}
function save(markChanges=true){
 if(markChanges){
  const now=Date.now();
  stampChangedCollection(S.items||[],_syncBaseline.items||[],now);
  stampChangedCollection(S.meetings||[],_syncBaseline.meetings||[],now);
  stampChangedCollection(S.meetingSeries||[],_syncBaseline.meetingSeries||[],now);
 }
 localStorage.setItem(KEY,JSON.stringify(S));
 _syncBaseline=JSON.parse(JSON.stringify(S));
}

function isDesktop(){return window.matchMedia('(min-width:1024px)').matches}
function isStandalone(){
 return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
}
function renderBrowserLanding(){
 document.querySelector('nav').style.display='none';
 $('#fab').style.display='none';
 $('#view').innerHTML=`<section class="browserLanding"><div class="browserLandingCard">
  <div class="browserLandingLogo"><img src="./logo-grawe-2021.png" alt="GRAWE"></div>
  <h1>Obaveze</h1>
  <div class="localBadge">● Lokalna aplikacija</div>
  <p>Radni podaci se čuvaju samo u instaliranoj aplikaciji na ovom uređaju. Ova web stranica služi samo za instalaciju i ažuriranje aplikacije.</p>
  <div class="steps"><b>Na iPhone-u</b>Otvori Share meni u Safariju i izaberi <strong>Add to Home Screen</strong>. Nakon instalacije, za svakodnevni rad otvaraj samo ikonicu <strong>Obaveze</strong> sa početnog ekrana.</div>
  <div class="steps"><b>Na laptopu (Edge ili Chrome)</b>U adresnoj traci klikni ikonicu za instalaciju (ili meni ⋯ → <strong>Aplikacije → Instaliraj ovu lokaciju kao aplikaciju</strong>). Aplikacija se otvara u svom prozoru, sa sopstvenim lokalnim podacima. Postojeće podatke sa telefona prenosiš preko <strong>Backup</strong> na telefonu i <strong>Vrati backup</strong> na laptopu.</div>
 </div></section>`;

function daysSince(d){
 if(!d)return 99999;
 return Math.floor((new Date(today()+"T00:00:00")-new Date(d+"T00:00:00"))/86400000);
}
function backupDue(){return !S._lastBackup || daysSince(S._lastBackup)>=14}
function activeActions(){return S.items.filter(x=>x.Tip==="Akcija"&&x.Status!=="Završeno")}
function legacyProjects(){return S.items.filter(x=>x.Tip==="Projekat"&&x.Status!=="Završen")}
function projectSeries(){return (S.meetingSeries||[]).filter(s=>s.Tip==="Projektna"&&s.Status!=="Završen")}
function recurringSeries(){return (S.meetingSeries||[]).filter(s=>s.Tip!=="Projektna")}
// Grupa serije: izričito upisana, inače prefiks naziva ispred " – " (npr. "KF – usklađenost" → "KF").
function seriesPrefix(s){const m=String(s?.Naziv||"").match(/^(.{1,40}?)\s+[–—-]\s+(\S.*)$/);return m?{group:m[1].trim(),rest:m[2].trim()}:null}
function groupKey(g){return String(g||"").trim().replace(/\s+/g," ").toLocaleLowerCase()}
function rawSeriesGroup(s){if(s&&s.BezGrupe===true)return "";if(s&&typeof s.Grupa==="string"&&s.Grupa.trim())return s.Grupa.trim().replace(/\s+/g," ");return seriesPrefix(s)?.group||""}
function groupLabel(key){
 // naziv grupe: izričito upisan ima prednost, inače najčešći oblik prefiksa
 const cands=recurringSeries().filter(z=>groupKey(rawSeriesGroup(z))===key);
 const explicit=cands.find(z=>typeof z.Grupa==="string"&&z.Grupa.trim());
 if(explicit)return explicit.Grupa.trim().replace(/\s+/g," ");
 const cnt=new Map();cands.forEach(z=>{const g=rawSeriesGroup(z);cnt.set(g,(cnt.get(g)||0)+1)});
 return [...cnt.entries()].sort((a,b)=>b[1]-a[1])[0]?.[0]||key;
}
function seriesGroup(s){const k=groupKey(rawSeriesGroup(s));return k?groupLabel(k):""}
function allSeriesGroups(){return [...new Set(recurringSeries().map(seriesGroup).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function seriesFullName(s){if(!s)return "";const g=seriesGroup(s),pf=seriesPrefix(s);if(g&&!(pf&&groupKey(pf.group)===groupKey(g)))return `${g} – ${s.Naziv}`;return s.Naziv||""}
function seriesShortName(s){const g=seriesGroup(s),pf=seriesPrefix(s);return pf&&groupKey(pf.group)===groupKey(g)?pf.rest:(s?.Naziv||"")}
function seriesGroupsOf(list){const map=new Map();list.forEach(z=>{const g=seriesGroup(z);if(!map.has(g))map.set(g,[]);map.get(g).push(z)});const keys=[...map.keys()].sort((a,b)=>(a===""?-1:b===""?1:a.localeCompare(b)));return keys.map(k=>({group:k,items:map.get(k).sort((a,b)=>seriesShortName(a).localeCompare(seriesShortName(b)))}))}
function seriesOptionsHTML(list,selectedId){return seriesGroupsOf(list).map(g=>{const opts=g.items.map(z=>`<option value="${z.ID}" ${Number(selectedId)===Number(z.ID)?"selected":""}>${esc(g.group?seriesShortName(z):z.Naziv)}</option>`).join("");return g.group?`<optgroup label="${esc(g.group)}">${opts}</optgroup>`:opts}).join("")}
function projectById(id){const p=seriesById(id);return p&&p.Tip==="Projektna"?p:null}
function projectChildren(id){return (S.meetingSeries||[]).filter(z=>z.Tip==="Projektna"&&Number(z.NadProjekatID)===Number(id))}
function projectParent(p){return p&&p.NadProjekatID?projectById(p.NadProjekatID):null}
function projectLabel(p){if(!p)return "";const par=projectParent(p);return par?`${par.Naziv} › ${p.Naziv}`:p.Naziv}
function projectScopeIds(id){return [Number(id),...projectChildren(id).map(z=>Number(z.ID))]}
function projectOpenActionsDeep(id){const ids=new Set(projectScopeIds(id));return activeActions().filter(x=>ids.has(Number(x.ProjekatID)))}
function projectOptionsHTML(selectedId,includeId){
 const act=(S.meetingSeries||[]).filter(z=>z.Tip==="Projektna"&&(z.Status!=="Završen"||Number(z.ID)===Number(selectedId)||Number(z.ID)===Number(includeId)));
 const tops=act.filter(z=>!z.NadProjekatID||!act.some(q=>Number(q.ID)===Number(z.NadProjekatID))).sort((a,b)=>(a.Naziv||"").localeCompare(b.Naziv||""));
 return tops.map(t=>{const kids=act.filter(z=>Number(z.NadProjekatID)===Number(t.ID)).sort((a,b)=>(a.Naziv||"").localeCompare(b.Naziv||""));
  return `<option value="${t.ID}" ${Number(selectedId)===Number(t.ID)?"selected":""}>${esc(t.Naziv)}</option>`+kids.map(k=>`<option value="${k.ID}" ${Number(selectedId)===Number(k.ID)?"selected":""}>&nbsp;&nbsp;› ${esc(k.Naziv)}</option>`).join("")}).join("");
}

function daysTo(d){if(!d)return 99999;return Math.ceil((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000)}
function greeting(){
 const h=new Date().getHours();
 return h<11?"Dobro jutro":h<18?"Dobar dan":"Dobro veče";
}
function monthShort(d){
 if(!d)return "";
 const m=["JAN","FEB","MAR","APR","MAJ","JUN","JUL","AVG","SEP","OKT","NOV","DEC"];
 const dt=new Date(d+"T00:00:00"); return m[dt.getMonth()];
}

function attentionSort(a,b){
 const score=x=>{let s=0,d=daysTo(x.Rok);if(d<0)s+=1000;if(x.Znacaj==="Strateško")s+=500;if(d>=0&&d<=7)s+=300;if(!x.Rok)s+=20;return -s};
 return score(a)-score(b);
}

function vAkcije(){

  const arr=all();
  if(actionView.scope==="mine")return arr.filter(x=>(x.Odgovoran||"")==="Ivan");
  if(actionView.scope==="followup")return arr.filter(x=>(x.Odgovoran||"")!=="Ivan");
  return arr;
 };
 const isFiltered=()=>actionView.scope!=="mine"||actionView.area!=="all"||actionView.importance!=="all"||actionView.priority!=="all"||!!actionView.search;
 const baseFiltered=()=>{
  let arr=scopedAll();
  if(actionView.area!=="all")arr=arr.filter(x=>(x.Oblast||"Poslovno")===actionView.area);
  if(actionView.importance!=="all")arr=arr.filter(x=>(x.Znacaj||"Operativno")===actionView.importance);
  if(actionView.priority!=="all")arr=arr.filter(x=>(x.Prioritet||"Normalan")===actionView.priority);
  if(actionView.search){
   const q=actionView.search.toLocaleLowerCase();
   arr=arr.filter(x=>{
    const m=x.KolegijumID?meetingById(x.KolegijumID):null;
    const ser=x.SerijaID?seriesById(x.SerijaID):(m?.SerijaID?seriesById(m.SerijaID):null);
    return [x.Zadatak,x.Odgovoran,x.Projekat,x.Izvor,m?fmtDate(m.Datum||""):"",m?.Naslov,m?.Napomena,ser?.Naziv,x["Detalj izvora"],x["Detalji dogovora"]].filter(Boolean).join(" ").toLocaleLowerCase().includes(q);
   });
  }
  return arr;
 };
 const groups=arr=>({
  late:arr.filter(x=>daysTo(x.Rok)<0),
  today:arr.filter(x=>x.Rok===today()),
  week:arr.filter(x=>daysTo(x.Rok)>=1&&daysTo(x.Rok)<=7),
  later:arr.filter(x=>daysTo(x.Rok)>7)
 });

function navFrameValid(frame){

 if(kind==="meeting"||kind==="minutes"||kind==="meetingNote"||kind==="meetingNotes"||kind==="agendaForm"||kind==="finishMeeting")return !!meetingById(id);

 if(kind==="project")return !!projectById(id)||!!S.items.find(x=>Number(x.ID)===id&&x.Tip==="Projekat");

 if(kind==="meetingForm")return raw==="new"||!!meetingById(id);
 if(kind==="itemForm")return raw==="new"||!!S.items.find(x=>Number(x.ID)===id);
 if(kind==="seriesForm")return raw==="new"||!!seriesById(id);
 return true;
}
function navFindFrame(key){

}
function navTakeCurrentNodes(){

}
function navRestoreFrame(frame){

 body.innerHTML="";
 (frame.nodes||[]).forEach(n=>body.appendChild(n));
 body.scrollTop=frame.scrollTop||0;
 frame.nodes=null;

function navOpen(html,key=null,options={}){

 const dedupe=options.dedupe!==false;

 if(found===-2){
  body.innerHTML=html;
  dialogNavCurrent.refresh=options.refresh||dialogNavCurrent.refresh||null;
  dialogNavCurrent.onResume=options.onResume||dialogNavCurrent.onResume||null;
  if(!d.open)d.showModal();
  return;
 }
 if(found>=0){
  const picked=dialogNavStack[found];
  dialogNavStack.splice(found);
  body.innerHTML=html;
  dialogNavCurrent={...picked,nodes:null,scrollTop:0,refresh:options.refresh||picked.refresh||null,onResume:options.onResume||picked.onResume||null};
  if(!d.open)d.showModal();

 }

  dialogNavCurrent.dirty=dlgDirty;
  dialogNavCurrent.nodes=navTakeCurrentNodes();
  dialogNavCurrent.scrollTop=body.scrollTop||0;
  dialogNavStack.push(dialogNavCurrent);
 }
 body.innerHTML=html;

 dialogNavCurrent={key,refresh:options.refresh||null,onResume:options.onResume||null,nodes:null,scrollTop:0};
 if(!d.open)d.showModal();
}

function navBack(result=null){

  const frame=dialogNavStack.pop();
  if(!navFrameValid(frame))continue;

const archiveMeetingView={period:"thisMonth",from:"",to:"",series:"",search:""};
function archiveDateRange(period){
 const now=new Date(today()+"T00:00:00");
 const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`};
 const monday=d=>{const x=new Date(d);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x};
 if(period==="thisWeek"){const a=monday(now),b=new Date(a);b.setDate(a.getDate()+6);return [iso(a),iso(b)]}
 if(period==="lastWeek"){const b=monday(now);b.setDate(b.getDate()-1);const a=new Date(b);a.setDate(b.getDate()-6);return [iso(a),iso(b)]}
 if(period==="thisMonth"){const a=new Date(now.getFullYear(),now.getMonth(),1),b=new Date(now.getFullYear(),now.getMonth()+1,0);return [iso(a),iso(b)]}
 if(period==="lastMonth"){const a=new Date(now.getFullYear(),now.getMonth()-1,1),b=new Date(now.getFullYear(),now.getMonth(),0);return [iso(a),iso(b)]}
 if(period==="custom")return [archiveMeetingView.from||"",archiveMeetingView.to||""];
 return ["",""];
}

function wkMonday(isoDate){const d=new Date((isoDate||today())+"T00:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function wkAdd(isoDate,k){const d=new Date(isoDate+"T00:00:00");d.setDate(d.getDate()+k);return iso(d)}
function wkLabel(start){
 const a=new Date(start+"T00:00:00"),b=new Date(wkAdd(start,6)+"T00:00:00");
 const dd=x=>String(x.getDate()).padStart(2,"0"),mm=x=>String(x.getMonth()+1).padStart(2,"0");
 return a.getMonth()===b.getMonth()?`${dd(a)}.–${dd(b)}.${mm(b)}.${b.getFullYear()}.`:`${dd(a)}.${mm(a)}.–${dd(b)}.${mm(b)}.${b.getFullYear()}.`;
}
const WK_DAYS=["ned","pon","uto","sri","čet","pet","sub"];
function wkShort(isoDate){const d=new Date(isoDate+"T00:00:00");return `${WK_DAYS[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.`}

 const meetings=(S.meetings||[]).filter(m=>m.Status!=="Završen"&&m.Datum>=start&&m.Datum<=end).sort((a,b)=>(a.Datum||"").localeCompare(b.Datum||""));
 const meetingGroups=meetings.map(m=>({label:meetingLabel(m),meetingId:m.ID,topics:meetingItems(m.ID).filter(n=>n.Tip==="Beleška"&&n.AgendaStavka&&n.Status!=="Arhivirana"&&!agendaProcessed(n))}));

 const inbox=realNotes().filter(n=>n.Status!=="Arhivirana"&&n.Status!=="Završeno").sort((a,b)=>(b.ID||0)-(a.ID||0));
 return {end,mineOpen,mineDone,deleg,meetingGroups,queued,inbox};
}

function wkLogNorm(log){
 if(!log)return null;
 if(Array.isArray(log.entries))return log;
 const it=id=>S.items.find(x=>Number(x.ID)===Number(id));
 const mk=(id,dec)=>{const x=it(id);return {id,t:x?.Zadatak||"(obrisana obaveza)",who:x?.Odgovoran||"",rokBefore:"",dec,rokAfter:dec==="rok"?(x?.Rok||""):""}};
 return {...log,legacy:true,entries:[...(log.done||[]).map(id=>mk(id,"done")),...(log.cancelled||[]).map(id=>mk(id,"cancel")),...(log.carried||[]).map(id=>mk(id,"rok"))],doneInWeek:[],deleg:[]};
}
function wkSnapshotGroups(log){
 const L=wkLogNorm(log),E=L.entries;
 return [
  {key:"done",title:"Realizovano",rows:[...(L.doneInWeek||[]).filter(x=>!x.cancel).map(x=>({id:x.id,t:x.t,info:`završeno ${wkShort(x.date)}`})),...E.filter(e=>e.dec==="done").map(e=>({id:e.id,t:e.t,info:"završeno pri zatvaranju"}))]},
  {key:"cancel",title:"Otkazano",rows:[...(L.doneInWeek||[]).filter(x=>x.cancel).map(x=>({id:x.id,t:x.t,info:`otkazano ${wkShort(x.date)}`})),...E.filter(e=>e.dec==="cancel").map(e=>({id:e.id,t:e.t,info:"otkazano pri zatvaranju"}))]},
  {key:"next",title:"U sljedeću nedjelju — rok ostaje",rows:E.filter(e=>e.dec==="next").map(e=>({id:e.id,t:e.t,info:e.rokBefore?`rok ${fmtDate(e.rokBefore)}${e.rokBefore<L.closedAt?" (kasni)":""}`:""}))},
  {key:"rok",title:"Novi rok",rows:E.filter(e=>e.dec==="rok").map(e=>({id:e.id,t:e.t,info:e.rokBefore?`${fmtDate(e.rokBefore)} → ${fmtDate(e.rokAfter)}`:(e.rokAfter?`novi rok ${fmtDate(e.rokAfter)}`:"")}))},
  {key:"open",title:"Ostalo otvoreno — bez odluke",rows:E.filter(e=>e.dec==="open").map(e=>({id:e.id,t:e.t,info:e.rokBefore?`rok ${fmtDate(e.rokBefore)}`:""}))},

 ];

async function buildWeekReportPdfBlob(st,log){

 const newPage=()=>{c=document.createElement("canvas");c.width=W*PDF_SCALE;c.height=H*PDF_SCALE;ctx=c.getContext("2d");ctx.scale(PDF_SCALE,PDF_SCALE);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);pages.push(c);y=M;head()};
 const ensure=hh=>{if(y+hh>CONTENT_BOTTOM)newPage()};
 newPage();
 font(32,700);ctx.fillStyle=DARK;ctx.fillText(`Nedjelja ${wkLabel(st)}`,M,y+28);y+=50;
 font(18,400);ctx.fillStyle=MUTED;ctx.fillText(`Zatvoreno ${fmtDate(L.closedAt||"")}${L.updatedAt&&L.updatedAt!==L.closedAt?` · dopunjeno ${fmtDate(L.updatedAt)}`:""}`,M,y+18);y+=40;
 const cnt=k=>G.find(g=>g.key===k).rows.length;
 const stats=[["Realizovano",cnt("done")],["Otkazano",cnt("cancel")],["Preneseno",cnt("next")+cnt("rok")],["Bez odluke",cnt("open")],["Delegirano",cnt("deleg")]];
 const bw=(W-2*M)/stats.length;stats.forEach(([l,v],i)=>{ctx.fillStyle=LIGHT;ctx.fillRect(M+i*bw+4,y,bw-8,92);font(36,700);ctx.fillStyle=i===0?GREEN:DARK;ctx.fillText(String(v),M+i*bw+22,y+50);font(15,400);ctx.fillStyle=MUTED;ctx.fillText(l,M+i*bw+22,y+76)});y+=124;
 G.forEach(g=>{if(!g.rows.length)return;ensure(90);font(21,700);ctx.fillStyle=GREEN;ctx.fillText(`${g.title} (${g.rows.length})`,M,y+22);y+=34;ctx.strokeStyle=LINE;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(M,y);ctx.lineTo(W-M,y);ctx.stroke();
  g.rows.forEach((r,i)=>{const tl=wrap(r.t,W-2*M-360,18,600),hh=Math.max(48,16+tl.length*24);ensure(hh);if(i%2===1){ctx.fillStyle=LIGHT;ctx.fillRect(M,y,W-2*M,hh)}font(18,600);ctx.fillStyle=DARK;tl.forEach((l,k)=>ctx.fillText(l,M+12,y+30+k*24));font(15,400);ctx.fillStyle=MUTED;ctx.textAlign="right";ctx.fillText(r.info||"",W-M-12,y+30);ctx.textAlign="left";y+=hh;ctx.strokeStyle=LINE;ctx.beginPath();ctx.moveTo(M,y);ctx.lineTo(W-M,y);ctx.stroke()});
  y+=28});
 const gen=new Date().toLocaleString("sr-Latn-ME");
 pages.forEach((pg,i)=>{const cc=pg.getContext("2d");cc.strokeStyle=LINE;cc.beginPath();cc.moveTo(M,H-52);cc.lineTo(W-M,H-52);cc.stroke();cc.font='14px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif';cc.fillStyle=MUTED;cc.textAlign="left";cc.fillText("Obaveze",M,H-26);cc.textAlign="center";cc.fillText(`Strana ${i+1}/${pages.length}`,W/2,H-26);cc.textAlign="right";cc.fillText(`Generisano: ${gen}`,W-M,H-26)});
 return pdfFromJpegs(pages.map(pg=>({width:pg.width,height:pg.height,bytes:dataUrlBytes(pg.toDataURL("image/jpeg",0.94))})));

  const blob=await buildWeekReportPdfBlob(st,log),file=new File([blob],fileName,{type:"application/pdf"});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:fileName});return}catch(e){if(e?.name==="AbortError")return}}
  const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=fileName;a.style.display="none";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},60000);
 }catch(e){console.error(e);alert("Izvještaj nedjelje nije mogao da se generiše.")}
}

function sendMinutesDialog(meetingId,extras){
 const m=meetingById(meetingId);if(!m)return;
 if(!S.contacts||typeof S.contacts!=="object")S.contacts={};
 const ex=extras||m.ZapisnikDraft||{};
 const names=parseParticipants(ex.present!==undefined&&ex.present!==""?ex.present:minutesParticipants(m)).filter(n=>n.toLocaleLowerCase()!=="ivan");
 const d0=meetingMinutesData(m),label=meetingLabel(m).replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'");
 const fileName=minutesFileName(d0)+".pdf",dot=label.endsWith(".")?"":".";
 navOpen(`<div class="row between"><div><h2>Pošalji zapisnik</h2><div class="sm mute">${meetingLabel(m)}</div></div><button class="btn" id="smClose">×</button></div>
  <div class="sm mute" style="margin-top:8px">Unesi e-mail adrese učesnika — aplikacija ih pamti za sljedeće sastanke.</div>
  <div class="list" style="margin-top:10px">${names.map((n,i)=>`<label class="card tight smRow"><input type="checkbox" data-sm-on="${i}" checked><b>${esc(n)}</b><input type="email" data-sm-mail="${i}" value="${esc(S.contacts[n]||"")}" placeholder="e-mail adresa"></label>`).join("")||`<div class="empty">Na zapisniku nema drugih prisutnih osim tebe.</div>`}</div>
  <label style="display:block;margin-top:10px">Dodatni primaoci (zarezom)<input id="smExtra" placeholder="adrese odvojene zarezom"></label>
  <label class="smCheck"><input type="checkbox" id="smBody" checked><span>U tijelo maila stavi i zaključke i zadatke</span></label>
  <div class="card tight" style="margin-top:12px;background:#f6f9f7"><b>Kako ide</b><div class="sm" style="margin-top:4px">1. Klikni „Pripremi mail”: PDF <b>${esc(fileName)}</b> se snima u Preuzimanja, a Outlook otvara novi mail sa primaocima i naslovom.<br>2. Prevuci PDF iz trake za preuzimanja (ili iz foldera Preuzimanja) u mail i pošalji. Pregledač ne može sam da priloži fajl u Outlook.</div></div>
  <div class="btnrow" style="margin-top:14px;justify-content:flex-end"><button class="btn pri" id="smGo">Pripremi mail</button></div>`,`sendMinutes:${meetingId}`,{dedupe:true});
 $("#smClose").onclick=navBack;
 $("#smGo").onclick=async()=>{
  const to=[];let bad=[];
  names.forEach((n,i)=>{const e=($(`[data-sm-mail="${i}"]`).value||"").trim();if(e)S.contacts[n]=e;else delete S.contacts[n];if($(`[data-sm-on="${i}"]`).checked){if(e)to.push(e);else bad.push(n)}});
  ($("#smExtra").value||"").split(/[,;\s]+/).map(x=>x.trim()).filter(Boolean).forEach(e=>to.push(e));
  save();
  if(!to.length){alert("Nema nijedne e-mail adrese. Unesi bar jednog primaoca.");return}
  if(bad.length&&!confirm(`Bez adrese: ${bad.join(", ")}. Nastaviti bez njih?`))return;
  await exportMinutesPDF(meetingMinutesData(m),ex);
  const subject=`Zapisnik — ${label}`;
  let body=`Poštovani,\n\nu prilogu je zapisnik sa sastanka ${label}${dot}\n`;
  if($("#smBody").checked){const t=meetingConclusionsText(m).replace(/\n[A-ZČĆŠŽĐ ]+\n—(?=\n|$)/g,"").trim();if(t)body+=`\n${t}\n`}
  body+=`\nSrdačan pozdrav,\nIvan`;
  let url=`mailto:${to.map(encodeURIComponent).join(",")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  if(url.length>1900){url=`mailto:${to.map(encodeURIComponent).join(",")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(`Poštovani,\n\nu prilogu je zapisnik sa sastanka ${label}${dot}\n\nSrdačan pozdrav,\nIvan`)}`;setTimeout(()=>alert("Zaključci su predugački za automatski unos u mail — u mailu je samo kratak tekst, a sve je u PDF prilogu."),600)}
  window.__lastMailto=url;setTimeout(()=>{window.location.href=url},400);
 };
}
